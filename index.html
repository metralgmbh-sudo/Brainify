</head>

<body>

  <!-- 🔐 Access Code Gate (Pasul A) -->
<div id="codeGate" class="gate">
  <div class="gate-card">
    <div class="gate-title">Brainify Test Access</div>
    <div class="gate-sub">Enter your test code to continue.</div>

    <input id="codeInput" class="gate-input" type="text" placeholder="e.g. BF-TEST-001" autocomplete="off" />

    <button id="codeBtn" class="gate-btn">Continue</button>

    <div id="codeMsg" class="gate-msg"></div>
  </div>
</div> 
  <div class="app-container">
    <header class="topbar">
  <div class="brand">

    
    <div class="logo">
      <img src="assets/logo2.png"
      alt="Brainify Logo">
    </div>

    <div class="titles">
      <div class="title">Brainify AI</div>
<div class="header-right">
  <div id="statusPill" class="status-pill">
    <span id="statusDot" class="dot ready"></span>
    <span id="statusText">Ready</span>
    <span id="statusSpinner" class="spinner" style="display:none;"></span>
  </div>
</div>



      <div class="status" id="statusDot">
        <span class="dot"></span>
    </div>
  </div>

  <div class="actions">
    <button class="iconbtn" id="themeBtn" title="Theme">☾</button>
  </div>
</header>


    <div id="chat"></div>

   <div class="composer">
  <div class="composer-actions">
    <button id="askBtn" onclick="ask()">Ask</button>
    <button id="micBtn" type="button">🎤</button>
    <button id="clearBtn" onclick="clearChat()">Clear</button>
  </div>

  <textarea id="input" placeholder="Type your message... (Enter = send, Shift+Enter = new line)"></textarea>
</div>


  <script>

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const askBtn = document.getElementById("askBtn");
    // ===== GREETING =====
window.addEventListener("load", () => {
  addMessage("ai", " 👋I`m Brainify AI. How can i help you today?");
  input.focus();
}); 

// ===== Voice reply state (TTS) =====
let lastInputWasVoice = false;
let lastVoiceLang = navigator.language || "ro-RO";

let voicesCache = [];
function loadVoices() {
  voicesCache = window.speechSynthesis ? speechSynthesis.getVoices() : [];
}
if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

// detect language from text
function detectLang(text) {
  const t = (text || "").toLowerCase();

  const ro = ["ă","â","î","ș","ț","vreau","te rog","cum","unde","când"];
  const de = ["ich","du","und","nicht","bitte","was","wie","danke"];
  const en = ["the","and","what","how","where","please","thanks"];

  const score = arr => arr.filter(w => t.includes(w)).length;

  const sRO = score(ro);
  const sDE = score(de);
  const sEN = score(en);

  if (sDE > sRO && sDE > sEN) return "de-DE";
  if (sEN > sRO && sEN > sDE) return "en-US";
  return "ro-RO";
}

// speak answer
function speak(text, lang) {
  if (!window.speechSynthesis) {
    console.warn("Speech synthesis not supported");
    return;
  }

  window.speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang || navigator.language || "en-US";
  utter.rate = 1;
  utter.pitch = 1;
  utter.volume = 1;

  window.speechSynthesis.speak(utter);
}

    // ===== Auto-grow textarea =====
function autoGrow() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
}

input.addEventListener("input", autoGrow);


    function clearChat() {
  chat.innerHTML = "";
  localStorage.removeItem("brainiac_chat");
}


    function scrollToBottom(){
      chat.scrollTop = chat.scrollHeight;
    }

    function addMessage(role, text){
      const row = document.createElement("div");
      row.className = "row " + (role === "user" ? "user" : "ai");

      const bubble = document.createElement("div");
      bubble.className = "bubble " + (role === "user" ? "user" : "ai");
      bubble.textContent = text;

      row.appendChild(bubble);
      chat.appendChild(row);
      scrollToBottom();
      return bubble;
    }

    function setBusy(isBusy){
      askBtn.disabled = isBusy;
      input.disabled = isBusy;
      askBtn.textContent = isBusy ? "..." : "Ask";
    }

    // Enter = send, Shift+Enter = newline
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        ask();
      }
    });
const REQUEST_TIMEOUT_MS = 30000;

function fetchWithTimeout(url, options = {}, timeout = REQUEST_TIMEOUT_MS) {
  const controller =new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);

  return fetch(url, { ...options, signal: controller.signal })
    .finally(() => clearTimeout(id));
}

const target = ((lastVoiceLang || navigator.language || "en-US") + "").toLowerCase();
const base = target.split("-")[0]; 
function pickVoiceForLang(lang) {
  if (!("speechSynthesis" in window)) return null;
  if (!voicesCache.length) loadVoices();

const target = ((lastVoiceLang || navigator.language || "en-US") + "").toLowerCase();
const base = target.split("-")[0]; 
  let v = voicesCache.find(x =>
    (x.lang || "").toLowerCase() === target
  );
  if (v) return v;

  v = voicesCache.find(x =>
    (x.lang || "").toLowerCase().startsWith(base)
  );
  if (v) return v;

  return voicesCache[0] || null;
} 

function speakAI(text, lang) {
  if (!("speechSynthesis" in window)) return;
  if (!text) return;

  speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang || navigator.language || "en-US";
  utter.rate = 1;
  utter.pitch = 1;
  utter.volume = 1;

  speechSynthesis.speak(utter);
}

async function ask() {
  const question = input.value.trim();
  if (!question) return;

  input.value = "";
  addMessage("user", question);
  setBusy(true);

  const typingBubble = addMessage("ai", "Typing...");

  try {
    const response = await fetchWithTimeout("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });

    const data = await response.json();
    const answer = (data && data.answer) ? String(data.answer) : "No answer";

    typingBubble.textContent = answer;

    if (lastInputWasVoice) {
      speakAI(answer, lastVoiceLang);
      lastInputWasVoice = false;
    }
  } catch (err) {
    typingBubble.textContent = "Server not responding.";
    console.error(err);
  } finally {
    setBusy(false);
    input.focus();
  }
}


// ===== Voice Input =====
const micBtn = document.getElementById("micBtn");

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition && micBtn) {
  const recognition = new SpeechRecognition();

  recognition.lang = navigator.language || "ro-RO";
  recognition.interimResults = false;
  recognition.continuous = false;

  let isListening = false;

  function setMicUI(listening) {
    micBtn.textContent = listening ? "⏹️" : "🎤";
  }

  micBtn.onclick = () => {
    if (isListening) {
      recognition.stop();
      return;
    }

    try {
      recognition.lang = navigator.language || "ro-RO";
      isListening = true;
      setMicUI(true);
      recognition.start();
    } catch (e) {
      console.error("Mic start error:", e);
      isListening = false;
      setMicUI(false);
    }
  };

  recognition.onresult = (event) => {
    const text = event.results?.[0]?.[0]?.transcript || "";
    if (!text) return;

    lastVoiceLang = recognition.lang || navigator.language || "ro-RO";
    lastInputWasVoice = true;

    input.value = text;
    autoGrow();
    ask();
  };

  recognition.onerror = (event) => {
    console.error("SpeechRecognition error:", event?.error || event);
  };

  recognition.onend = () => {
    isListening = false;
    setMicUI(false);
  };
} else {
  if (micBtn) micBtn.style.display = "none";
} 
// ===== PWA Service Worker =====
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js")
      .then(() => console.log("✅ Service Worker registered"))
      .catch(err => console.error("❌ SW error:", err));
  });
} 
// 🔐 Access Code Gate (Pasul A)
const codeGate = document.getElementById("codeGate");
const codeInput = document.getElementById("codeInput");
const codeBtn = document.getElementById("codeBtn");
const codeMsg = document.getElementById("codeMsg");

function showGate() {
  if (codeGate) codeGate.classList.add("show");
  if (codeInput) setTimeout(() => codeInput.focus(), 50);
}

function hideGate() {
  if (codeGate) codeGate.classList.remove("show");
}

function getSavedCode() {
  return localStorage.getItem("BRAINIFY_TEST_CODE") || "";
}
// ✅ PASUL B1: coduri valide (hard-coded)
// 🔒 Beta master switch
const BETA_OPEN = true; 
const VALID_TEST_CODES = new Set([
  "BF-TEST-001",
  "BF-TEST-002",
  "BF-TEST-003",
  "BF-TEST-004",
  "BF-TEST-005",
  "BF-TEST-006",
  "BF-TEST-007",
  "BF-TEST-008",
  "BF-TEST-009",
  "BF-TEST-0010",
  "BF-TEST-0011",
  "BF-TEST-0012",
  "BF-TEST-0013",
  "BF-TEST-0014",
  "BF-TEST-0015",
  "BF-TEST-0016",
  "BF-TEST-0017",
  "BF-TEST-0018",
  "BF-TEST-0019",
  "BF-TEST-0020",
]);

// ✅ dacă vrei să oprești complet testul:
// const BETA_OPEN = false;  // => nimeni nu intră
function saveCode(code) {
  localStorage.setItem("BRAINIFY_TEST_CODE", code);
}

function clearCode() {
  localStorage.removeItem("BRAINIFY_TEST_CODE");
}

// La încărcare: dacă nu există cod -> arată gate
window.addEventListener("load", () => {
  const saved = getSavedCode();
  if (!saved) showGate();
});

// Continue button
codeBtn.addEventListener("click", () => {
  const code = (codeInput?.value || "").trim();

  if (!BETA_OPEN) {
    if (codeMsg) codeMsg.innerText = "Test is closed right now.";
    return;
  }

  if (!code) {
    if (codeMsg) codeMsg.innerText = "Please enter a code.";
    return;
  }

  const normalized = code.toUpperCase();

  if (!VALID_TEST_CODES.has(normalized)) {
    if (codeMsg) codeMsg.innerText = "Invalid code. Please try again.";
    return;
  }

  saveCode(normalized);
  if (codeMsg) codeMsg.innerText = "";
  hideGate();
}); 

// Enter key in input
if (codeInput) {
  codeInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") codeBtn?.click();
  });
}
  </script>
